name: 'fraud_detection'
version: '1.0.0'
config-version: 2

profile: 'fraud_detection'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Legitimate auth->settlement drift tolerance (tips, FX conversion), as a
  # fraction of auth_amount. Real card networks vary this by MCC (e.g.
  # restaurants/hospitality tolerate a larger tip-driven drift than retail);
  # flattened to one rate here as a portfolio-scale simplification of those
  # MCC-based tolerance tables.
  recon_amount_tolerance_pct: 0.10

  # Absolute dollar-exposure ceiling on auth->settlement amount drift, applied
  # alongside the percentage tolerance above. A small percentage drift on a
  # large transaction can still represent real fraud/FX exposure, so cap
  # allowed drift in absolute terms too, independent of the percentage.
  recon_amount_ceiling_abs: 100.00

  # Minutes an approved, unsettled auth stays PENDING_SETTLEMENT before it's
  # reclassified as a break (AUTH_NO_SETTLEMENT). 10080 minutes = 7 days,
  # the literal real-world authorization hold-expiry this was always modeled
  # on - the producer now generates settlement delay as a real 2-48h
  # duration, so this threshold no longer needs to be compressed to match it.
  recon_maturity_minutes: 10080

  # Currencies the warehouse accepts. Enforced by
  # macros/transaction_validity.sql (rows carrying anything else are
  # quarantined, not dropped); mirrored on the producer side by
  # VALID_CURRENCIES in producer.py.
  valid_currencies: ['SGD', 'MYR', 'IDR', 'THB', 'USD', 'GBP', 'AUD']

models:
  fraud_detection:
    stg:
      # Thin, non-materialized reshapes of Silver. Views, so they always
      # reflect the current state of the model underneath rather than
      # needing their own refresh - which matters for the merchant master
      # the snapshot reads.
      +materialized: view
      +schema: silver
    silver:
      +materialized: incremental
      +incremental_strategy: merge
      +unique_key: transaction_id
      +schema: silver
      +on_schema_change: fail
    gold:
      +schema: gold
