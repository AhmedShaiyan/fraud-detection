version: 2

models:
  - name: slv_authorizations
    description: >
      One row per AUTH event, typed and card_id hashed. Incremental, merged
      on transaction_id. Rows failing macros/transaction_validity.sql are
      excluded here and held in slv_quarantine instead of being dropped.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: event_time
        data_tests:
          - not_null
      - name: card_id_hash
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['SGD', 'MYR', 'IDR', 'THB', 'USD', 'GBP', 'AUD']
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['POS', 'ONLINE', 'ATM', 'CONTACTLESS']

  - name: slv_settlements
    description: >
      One row per SETTLEMENT event, typed and card_id hashed. Incremental,
      merged on transaction_id. Rows failing macros/transaction_validity.sql
      are excluded here and held in slv_quarantine instead of being dropped.
      ~0.5% of rows are orphan force-posts whose auth_transaction_id matches
      no real AUTH (see relationships test below); note that running the
      producer with --dirty-rate adds more, since a settlement whose AUTH was
      quarantined has nothing left to match.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: event_time
        data_tests:
          - not_null
      - name: card_id_hash
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['SGD', 'MYR', 'IDR', 'THB', 'USD', 'GBP', 'AUD']
      - name: auth_transaction_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_authorizations')
                field: transaction_id
              config:
                severity: warn

  - name: slv_quarantine
    description: >
      Bronze rows failing any check in macros/transaction_validity.sql, held
      with the reasons they failed rather than dropped. Values are kept raw
      (uncast) so the malformed value itself is preserved; card_id is hashed
      as everywhere else in Silver. Incremental, merged on quarantine_key -
      transaction_id is nullable here by definition, so it cannot be the
      merge key.
    columns:
      - name: quarantine_key
        description: >
          sha2 of the row's identifying columns plus _source_file. Surrogate
          grain key, since no natural key is guaranteed present on a
          malformed row.
        data_tests:
          - unique
          - not_null
      - name: quarantine_reasons
        description: Array of failed check names; never empty by construction.
        data_tests:
          - not_null
      - name: quarantined_at
        description: >
          When the row first failed. Held stable across re-runs via
          merge_exclude_columns.
        data_tests:
          - not_null
