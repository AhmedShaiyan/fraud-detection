# Checked into the repo deliberately: no secrets live here, only env var
# references (CLAUDE.md: secrets ONLY via .env, never hardcoded). Point dbt
# at this file with --profiles-dir dbt (see run.ps1) instead of ~/.dbt/.
fraud_detection:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: fraud
      schema: silver
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
